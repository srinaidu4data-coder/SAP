name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Unit tests (offline CI)
        env:
          SAPILOT_OFFLINE: "1"
          SAPILOT_LAB: "1"
          SAPILOT_ALLOW_UNSIGNED_POLICY: "1"
          SAPILOT_DATA: ${{ github.workspace }}/data
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests -q --tb=line
