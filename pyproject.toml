[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapilot"
version = "1.0.0"
description = "SAPILOT — Autonomous SAP Execution Agent (diagnostic-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SAPILOT" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "jinja2>=3.1",
  "requests>=2.31",
  "openai>=1.40",
  "cryptography>=42.0",
  "rich>=13.7",
  "click>=8.1",
  "flask>=3.0",
]

[project.optional-dependencies]
sap = [
  "pywin32>=306; platform_system=='Windows'",
  # pyrfc requires NW RFC SDK on PATH — install separately
]
targeting = [
  # Tiered element-targeting fallback (see sapilot/autobot/targeting.py):
  # SAP GUI Scripting (core) -> UI Automation -> OCR -> full-vision.
  "comtypes>=1.4; platform_system=='Windows'",
  "uiautomation>=2.0; platform_system=='Windows'",
  "pytesseract>=0.3.10",
  # pytesseract also requires the Tesseract-OCR binary on PATH — not
  # pip-installable; the OCR tier degrades gracefully (skips) without it.
]
hana = ["hdbcli>=2.20"]
local-llm = ["llama-cpp-python>=0.2.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[project.scripts]
sapilot = "sapilot.cli:main"
sapilot-ui = "sapilot.webapp.app:main"

[tool.setuptools.packages.find]
include = ["sapilot*"]

[tool.setuptools.package-data]
sapilot = [
  "policy/*.yaml",
  "know/playbooks/*.yaml",
  "know/errors/*.yaml",
  "know/scenario_packs.yaml",
  "brain/prompts/*",
  "report/templates/*",
  "copilot/scenarios/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
